<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · Álvaro Fernández Ortuño</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/estilos.css">
<style>
  .perdida { min-height: 100vh; display: grid; place-items: center; padding: 40px 16px; }
  .perdida .pieza { max-width: 520px; padding: 46px 40px 40px; text-align: center; }
  .perdida h1 { font-size: clamp(2.2rem, 7vw, 3.2rem); line-height: 1.05; margin: 14px 0 14px; }
  .perdida p:not(.pieza-num) { color: var(--tinta-suave); margin-bottom: 26px; }
  .perdida .tapete { position: fixed; inset: auto 0 0 0; height: 34vh; border-radius: 0; z-index: -1; }
</style>
</head>
<body>
<main class="perdida">
  <div class="tapete" aria-hidden="true"></div>
  <div class="pieza">
    <p class="pieza-num">Error 404</p>
    <h1>Esta pieza no está en el patrón.</h1>
    <p>La página que buscas no existe o ha cambiado de sitio.</p>
    <a class="boton boton-tinta" href="/">Volver al inicio</a>
  </div>
</main>
</body>
</html>
