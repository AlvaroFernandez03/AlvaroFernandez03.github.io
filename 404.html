<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · Álvaro Fernández Ortuño</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#13171D">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/estilos.css">
<style>
  .perdida { min-height: 100vh; display: grid; place-items: center; padding: 40px 16px; }
  .perdida-caja { max-width: 520px; }
  .perdida-codigo { font-family: var(--f-codigo); font-size: 0.85rem; color: var(--fallo); margin-bottom: 14px; }
  .perdida h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.1; margin-bottom: 14px; }
  .perdida p { color: var(--tenue); margin-bottom: 26px; }
</style>
</head>
<body>
<main class="perdida">
  <div class="perdida-caja">
    <p class="perdida-codigo">404 · no encontrada</p>
    <h1>Esta página no existe.</h1>
    <p>La dirección está mal escrita o la página ha cambiado de sitio. Desde el inicio puedes llegar a todo.</p>
    <a class="boton boton-claro" href="/">Ir al inicio</a>
  </div>
</main>
</body>
</html>
